name: Build Android app

# Runs by itself whenever the Android app code changes on main (or by hand from the Actions tab), then publishes the
# signed APK as a GitHub Release. The server's /download page always serves the latest release, so nothing is
# committed to downloads/ any more.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write   # to create the release

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ca-app-pub-5500721504193090~2983159979
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Install and sync
        working-directory: android-app
        run: |
          npm ci
          npm run sync

      - name: Prepare release signing
        working-directory: android-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Work out the version
        id: version
        run: |
          # Every build gets a higher versionCode than the last, so phones accept it as an update of the installed app.
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB and APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PappVersionCode=${{ steps.version.outputs.code }} -PappVersionName=${{ steps.version.outputs.name }}

      - name: Publish the APK as the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          APK=$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" jyotisha.apk
          gh release create "v$VERSION" jyotisha.apk \
            --title "$VERSION" --notes "Android app $VERSION, built from ${GITHUB_SHA::7}." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: jyotisha-android
          path: |
            android-app/android/app/build/outputs/bundle/release/*.aab
            android-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
