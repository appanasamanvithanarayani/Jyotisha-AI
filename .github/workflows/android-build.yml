name: Build Android app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ca-app-pub-5500721504193090~2983159979
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Install and sync
        working-directory: android-app
        run: |
          npm ci
          npm run sync

      - name: Prepare release signing
        working-directory: android-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed AAB and APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jyotisha-android
          path: |
            android-app/android/app/build/outputs/bundle/release/*.aab
            android-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
