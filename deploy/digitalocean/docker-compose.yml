# Droplet setup: the app plus Caddy, which gets a free HTTPS certificate automatically.
# Usage (on the server, inside the repo folder):  cp deploy/digitalocean/env.example .env  &&  nano .env
#                                               docker compose -f deploy/digitalocean/docker-compose.yml --env-file .env up -d --build
services:
  app:
    build: ../..
    restart: unless-stopped
    environment:
      PORT: "8080"
      JYOTISHA_ALLOWED_HOSTS: ${DOMAIN},karthiktraders.store
      JYOTISHA_TRUST_PROXY: "1"
      JYOTISHA_CONTACT: ${CONTACT_EMAIL}
      JYOTISHA_ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JYOTISHA_ASK_DAILY_LIMIT: ${ASK_DAILY_LIMIT:-1000}
      JYOTISHA_ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      JYOTISHA_APP_ADS: ${APP_ADS:-0}
      JYOTISHA_ADMOB_BANNER_ID: ${ADMOB_BANNER_ID:-}
      JYOTISHA_ADMOB_TESTING: ${ADMOB_TESTING:-0}
      JYOTISHA_REWARDED_KUNDLI: ${REWARDED_KUNDLI:-0}
      JYOTISHA_ADMOB_REWARDED_ID: ${ADMOB_REWARDED_ID:-}
      JYOTISHA_REWARDED_CHAT: ${REWARDED_CHAT:-0}
      JYOTISHA_CHAT_FREE_QUESTIONS: ${CHAT_FREE_QUESTIONS:-10}
      JYOTISHA_CHAT_BONUS_QUESTIONS: ${CHAT_BONUS_QUESTIONS:-5}
      JYOTISHA_INTERSTITIAL: ${INTERSTITIAL:-0}
      JYOTISHA_ADMOB_INTERSTITIAL_ID: ${ADMOB_INTERSTITIAL_ID:-}
      JYOTISHA_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JYOTISHA_DATA_DIR: /data
    volumes:
      - admin_data:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data:
  admin_data:
