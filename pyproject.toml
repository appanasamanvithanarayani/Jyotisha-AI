[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotisha-ai"
version = "0.3.0"
description = "Research foundation for a source-grounded Jyotisha AI system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Jyotisha AI Contributors" }]
dependencies = ["pypdf==5.9.0", "astronomy-engine==2.1.19", "tzdata==2026.5", "numpy==1.26.4", "pyerfa==2.0.1.5"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
jyotisha-ai = "jyotisha_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jyotisha_ai.web" = ["index.html", "birth.html", "chart-ui.js", "calendar-ui.js", "panchang-names.js", "app.js", "app.css", "privacy.html", "download.html", "manifest.webmanifest", "sw.js", "icons/*.png", "locales/*.js"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

