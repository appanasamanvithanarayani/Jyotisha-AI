apply plugin: 'com.android.application'

// Release signing: reads the key details from a file outside the repo (never commit it).
// Point JYOTISHA_KEYSTORE_PROPERTIES at it, or put keystore.properties one folder above this app.
def keystoreProps = new Properties()
def keystoreFile = file(System.getenv("JYOTISHA_KEYSTORE_PROPERTIES") ?: "../keystore.properties")
if (keystoreFile.exists()) { keystoreFile.withInputStream { keystoreProps.load(it) } }

// Meta App Events configuration. Keep these values out of source control and pass them as either
// Gradle properties (-PMETA_APP_ID=... -PMETA_CLIENT_TOKEN=...) or environment variables.
// Debug builds remain usable without them; release builds fail below so an untracked production
// APK cannot be published accidentally.
def metaAppId = (project.findProperty("META_APP_ID") ?: System.getenv("META_APP_ID") ?: "").toString().trim()
def metaClientToken = (project.findProperty("META_CLIENT_TOKEN") ?: System.getenv("META_CLIENT_TOKEN") ?: "").toString().trim()
if (metaAppId && !(metaAppId ==~ /[0-9]+/)) {
    throw new GradleException("META_APP_ID must contain digits only")
}
if (metaClientToken && !(metaClientToken ==~ /[A-Za-z0-9]+/)) {
    throw new GradleException("META_CLIENT_TOKEN must contain letters and digits only")
}
if ((metaAppId && !metaClientToken) || (!metaAppId && metaClientToken)) {
    throw new GradleException("Set both META_APP_ID and META_CLIENT_TOKEN, or neither")
}

android {
    buildFeatures {
        buildConfig true
    }
    lint {
        checkReleaseBuilds false   // the release lint pass is very memory hungry and not needed for these builds
        abortOnError false
    }
    namespace "store.karthiktraders.jyotisha"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "store.karthiktraders.jyotisha"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bumped automatically by .github/workflows/android-build.yml on every release build; no need to edit by hand.
        versionCode 28
        versionName "1.0.28"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "META_APP_ID", "\"${metaAppId}\""
        buildConfigField "String", "META_CLIENT_TOKEN", "\"${metaClientToken}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreProps['storeFile']) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Analytics/App Events only. This is enough for Meta install and app-launch attribution and is
    // smaller than pulling in Login, Share, Gaming, and the rest of the full Facebook Android SDK.
    implementation "com.facebook.android:facebook-core:19.0.1"
    implementation "com.android.billingclient:billing:9.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.register("verifyMetaReleaseConfig") {
    doLast {
        if (!metaAppId || !metaClientToken) {
            throw new GradleException(
                "Release builds require META_APP_ID and META_CLIENT_TOKEN so Meta install tracking is not silently disabled"
            )
        }
    }
}

afterEvaluate {
    tasks.named("preReleaseBuild").configure { dependsOn("verifyMetaReleaseConfig") }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
